name: Java Code Style Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  style-check:
    name: Check Code Style with Spotless
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Check format configuration
        run: |
          if [ -f "format.xml" ]; then
            echo "✅ Using custom Eclipse format: format.xml"
          else
            echo "ℹ️  Using built-in Google Java Format"
          fi

      - name: Check code style
        run: mvn spotless:check

      - name: Upload spotless report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotless-report
          path: |
            **/target/spotless*.log
            **/target/spotless*.txt
          retention-days: 7
