name: Java CI — Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  unit-test:
    name: Unit Tests (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Run Unit Tests
        run: mvn test -pl 'pdm-common/pdm-common-core,pdm-common/pdm-common-security,pdm-auth,pdm-resident,pdm-household,pdm-keyperson,pdm-floating-population,pdm-missingperson,pdm-log,pdm-notification' -am

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Test Results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

  integration-test:
    name: Integration Tests (Docker required)
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Integration Tests
        run: mvn verify -pl pdm-auth -am -Pintegration -Dskip.unit.tests=true
        continue-on-error: true
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
