services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: pdm-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - pdm-mysql-data:/var/lib/mysql
      - ../sql/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - pdm-net

  # ==================== Elasticsearch ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: pdm-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - pdm-es-data:/usr/share/elasticsearch/data
    networks:
      - pdm-net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: pdm-redis
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    volumes:
      - pdm-redis-data:/data
    networks:
      - pdm-net

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: pdm-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - pdm-nacos-data:/home/nacos/data
    networks:
      - pdm-net

  # ==================== Nginx ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: pdm-nginx
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mysql
    networks:
      - pdm-net

networks:
  pdm-net:
    driver: bridge

volumes:
  pdm-mysql-data:
  pdm-es-data:
  pdm-redis-data:
  pdm-nacos-data:
