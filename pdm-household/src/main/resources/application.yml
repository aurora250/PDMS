server:
  port: 8083

spring:
  application:
    name: pdm-household
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://127.0.0.1:6432/pdm_shard_1
    username: pdm
    password: pdm123
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 25
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 10000
  data:
    redis:
      host: 127.0.0.1
      port: 16379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: YTk5ZjY3ZDIxMzQ1NmY4OTBiMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6

pdm:
  storage:
    root-dir: /data/pdm-files
