# ============================================================
# PDM 人口数据库管理系统 — 完整 Docker 编排
# 一键启动: docker compose up -d
# 一键停止: docker compose down
# ============================================================

services:
  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: pdm-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pdm_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - pdm-mysql-data:/var/lib/mysql
      - ./sql/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
      - ./sql/init-shard-schema.sql:/docker-entrypoint-initdb.d/02-shard-schema.sql
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/03-init-databases.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - pdm-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: pdm-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - pdm-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pdm-net

  redis:
    image: redis:7-alpine
    container_name: pdm-redis
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    volumes:
      - pdm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pdm-net

  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: pdm-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - pdm-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pdm-net

  # ==================== 微服务网关 ====================

  pdm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-gateway/target/pdm-gateway-1.0-SNAPSHOT.jar
    container_name: pdm-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_DATASOURCE_FLOW_NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 认证服务 ====================

  pdm-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-auth/target/pdm-auth-1.0-SNAPSHOT.jar
    container_name: pdm-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 常住人口服务 ====================

  pdm-resident:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-resident/target/pdm-resident-1.0-SNAPSHOT.jar
    container_name: pdm-resident
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_shard_0?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 户籍管理服务 ====================

  pdm-household:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-household/target/pdm-household-1.0-SNAPSHOT.jar
    container_name: pdm-household
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_shard_1?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 重点人员服务 ====================

  pdm-keyperson:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-keyperson/target/pdm-keyperson-1.0-SNAPSHOT.jar
    container_name: pdm-keyperson
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_shard_2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 流动人口服务 ====================

  pdm-floating-population:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-floating-population/target/pdm-floating-population-1.0-SNAPSHOT.jar
    container_name: pdm-floating-population
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_shard_3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 失踪人员服务 ====================

  pdm-missingperson:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-missingperson/target/pdm-missingperson-1.0-SNAPSHOT.jar
    container_name: pdm-missingperson
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_shard_3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 日志服务 ====================

  pdm-log:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-log/target/pdm-log-1.0-SNAPSHOT.jar
    container_name: pdm-log
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== 通知预警服务 ====================

  pdm-notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pdm-notification/target/pdm-notification-1.0-SNAPSHOT.jar
    container_name: pdm-notification
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdm_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - pdm-net
    restart: unless-stopped

  # ==================== Nginx ====================

  nginx:
    image: nginx:1.25-alpine
    container_name: pdm-nginx
    ports:
      - "18080:80"
    volumes:
      - ./docker/nginx-docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pdm-gateway
    networks:
      - pdm-net
    restart: unless-stopped

# ==================== 网络 & 卷 ====================

networks:
  pdm-net:
    driver: bridge

volumes:
  pdm-mysql-data:
  pdm-es-data:
  pdm-redis-data:
  pdm-nacos-data:
